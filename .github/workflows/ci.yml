name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ==========================================
  # JOB 1: Auditoria de dependências (SCA)
  # ==========================================
  dependency-audit:
    name: Auditoria de dependências (SCA)
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"

      - name: Auditar dependências (alta e crítica)
        run: npm run security:audit

  # ==========================================
  # JOB 2: Análise Estática (Lint & Type-Check)
  # ==========================================
  code-quality:
    name: Lint & Type Check
    runs-on: self-hosted
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Lint (ESLint)
        run: npm run lint

      - name: Executar Verificação de Tipos (TypeScript)
        run: npm run type-check

  # ==========================================
  # JOB 3: Testes Unitários (Jest)
  # ==========================================
  unit-tests:
    name: Testes Unitários
    runs-on: self-hosted
    env:
      JWT_SECRET: chave-aleatoria-com-pelo-menos-32-caracteres
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Jest Unitário
        run: npm run test:unit

  # ==========================================
  # JOB 4: Testes de Integração (com MySQL e Migrações)
  # ==========================================
  integration-tests:
    name: Testes de Integração
    runs-on: self-hosted
    needs: [code-quality, unit-tests, dependency-audit]

    env:
      DATABASE_URL: mysql://tcc_user:tcc_password@127.0.0.1:3306/tcc_db_test?connect_timeout=30&pool_timeout=30
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: tcc_user
      DATABASE_PASSWORD: tcc_password
      DATABASE_NAME: tcc_db_test
      JWT_SECRET: chave-aleatoria-com-pelo-menos-32-caracteres
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: tcc_db_test
          MYSQL_USER: tcc_user
          MYSQL_PASSWORD: tcc_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Cliente Prisma
        run: npx prisma generate

      - name: Executar Migrações no Banco de Teste
        run: npx prisma migrate deploy

      - name: Verificar conexão do Prisma Client
        run: npx tsx scripts/check-db-connection.ts

      - name: Executar Testes de Integração
        run: npm run test:integration

  # ==========================================
  # JOB 5: Testes End-to-End (Playwright)
  # ==========================================
  e2e-tests:
    name: Testes E2E (Playwright)
    runs-on: self-hosted
    needs: [integration-tests]
    env:
      DATABASE_URL: mysql://tcc_user:tcc_password@127.0.0.1:3306/tcc_db_e2e?connect_timeout=30&pool_timeout=30
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: tcc_user
      DATABASE_PASSWORD: tcc_password
      DATABASE_NAME: tcc_db_e2e
      JWT_SECRET: chave-aleatoria-com-pelo-menos-32-caracteres
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: tcc_db_e2e
          MYSQL_USER: tcc_user
          MYSQL_PASSWORD: tcc_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Gerar Cliente Prisma
        run: npx prisma generate

      - name: Executar Migrações para E2E
        run: npx prisma migrate deploy

      - name: Verificar conexão do Prisma Client
        run: npx tsx scripts/check-db-connection.ts

      - name: Instalar Navegadores do Playwright
        run: npx playwright install chromium

      - name: Executar Testes E2E
        run: npm run test:e2e
